<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Bloom</title>
</head>
<body>
<div id="BloomPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-select,emby-checkbox">
    <div data-role="content">
        <div class="content-primary">
            <style>
                #BloomPage .bloom-card { background: rgba(128,128,128,.08); border: 1px solid rgba(128,128,128,.2); border-radius: 10px; padding: 1.2em 1.4em; margin: 0 0 1.4em; }
                #BloomPage .bloom-card h3 { margin: 0 0 .4em; }
                #BloomPage .bloom-muted { opacity: .7; font-size: .92em; }
                #BloomPage .bloom-fp { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 1.05em; letter-spacing: .04em; background: rgba(128,128,128,.15); padding: .15em .45em; border-radius: 5px; white-space: nowrap; }
                #BloomPage .bloom-row { display: flex; flex-wrap: wrap; gap: .6em; align-items: center; }
                #BloomPage .bloom-libs { display: flex; flex-wrap: wrap; gap: .2em 1.4em; margin: .4em 0 .8em; }
                #BloomPage .bloom-libs .checkboxContainer { margin: 0; }
                #BloomPage textarea.bloom-code { width: 100%; box-sizing: border-box; min-height: 5.5em; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .85em; background: rgba(0,0,0,.25); color: inherit; border: 1px solid rgba(128,128,128,.35); border-radius: 6px; padding: .6em; word-break: break-all; resize: vertical; }
                #BloomPage .bloom-pill { display: inline-block; font-size: .78em; padding: .15em .65em; border-radius: 999px; font-weight: 600; vertical-align: middle; }
                #BloomPage .bloom-ok { background: rgba(34,197,94,.2); color: #4ade80; }
                #BloomPage .bloom-warn { background: rgba(234,179,8,.2); color: #facc15; }
                #BloomPage .bloom-err { background: rgba(239,68,68,.2); color: #f87171; }
                #BloomPage .bloom-off { background: rgba(148,163,184,.2); color: #cbd5e1; }
                #BloomPage .bloom-peer { border-top: 1px solid rgba(128,128,128,.2); padding: 1.1em 0 .4em; }
                #BloomPage .bloom-peer:first-child { border-top: 0; padding-top: .2em; }
                #BloomPage .bloom-peer h4 { margin: 0; font-size: 1.15em; }
                #BloomPage .bloom-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1em 2em; margin-top: .8em; }
                #BloomPage .bloom-import { display: grid; grid-template-columns: 1fr minmax(180px, 1.2fr); gap: .5em; align-items: center; margin: .35em 0; }
                #BloomPage .bloom-import select { width: 100%; }
                #BloomPage .bloom-msg { margin-top: .6em; }
                #BloomPage .bloom-msg.error { color: #f87171; }
                #BloomPage .bloom-msg.success { color: #4ade80; }
                #BloomPage .bloom-steps { margin: .3em 0 0; padding-left: 1.2em; }
                #BloomPage .bloom-hidden { display: none; }
                #BloomPage .emby-button.bloom-small { padding: .35em .9em; font-size: .9em; margin: 0; }
                #BloomPage .bloom-tabs { display: flex; gap: .2em; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid rgba(128,128,128,.25); margin: 0 0 1.4em; }
                #BloomPage .bloom-tabs::-webkit-scrollbar { display: none; }
                #BloomPage .bloom-tab { flex: 0 0 auto; display: inline-flex; align-items: center; background: none; border: 0; border-bottom: 2px solid transparent; color: inherit; font: inherit; padding: .75em 1em .65em; margin: 0 0 -1px; cursor: pointer; opacity: .65; white-space: nowrap; transition: opacity .15s, border-color .15s; }
                #BloomPage .bloom-tab:hover { opacity: 1; }
                #BloomPage .bloom-tab:focus-visible { outline: 2px solid #00a4dc; outline-offset: -2px; border-radius: 6px 6px 0 0; }
                #BloomPage .bloom-tab-active { opacity: 1; border-bottom-color: #00a4dc; font-weight: 600; }
                #BloomPage .bloom-tab-count { min-width: 1.5em; margin-left: .5em; padding: 0 .45em; border-radius: 999px; background: rgba(128,128,128,.25); font-size: .78em; line-height: 1.6; text-align: center; font-weight: 600; }
                #BloomPage .bloom-tab-count:empty { display: none; }
                #BloomPage .bloom-tab-count.bloom-tab-alert { background: rgba(239,68,68,.3); color: #fca5a5; }
                #BloomPage .bloom-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: .9em; margin: .7em 0 .9em; }
                #BloomPage .bloom-stat { background: rgba(128,128,128,.1); border-radius: 8px; padding: .8em 1em .9em; }
                #BloomPage .bloom-stat-label { opacity: .75; }
                #BloomPage .bloom-stat-total { font-size: 2.1em; font-weight: 600; line-height: 1.15; margin: .05em 0 .3em; font-variant-numeric: tabular-nums; }
                #BloomPage .bloom-stat-line { font-size: .92em; line-height: 1.5; }
                #BloomPage .bloom-stat-friends { opacity: .7; font-size: .85em; margin-top: .35em; }
            </style>

            <div class="verticalSection">
                <h2 class="sectionTitle" data-i18n="title"></h2>
                <p class="bloom-muted" data-i18n="intro"></p>
            </div>

            <!-- Tabs -->
            <div class="bloom-tabs" role="tablist">
                <button type="button" class="bloom-tab bloom-tab-active" role="tab" id="bloomTab-friends" data-tab="friends" aria-controls="bloomPanel-friends" aria-selected="true"><span data-i18n="friendsTitle"></span><span class="bloom-tab-count" id="bloomFriendsCount"></span></button>
                <button type="button" class="bloom-tab" role="tab" id="bloomTab-add" data-tab="add" aria-controls="bloomPanel-add" aria-selected="false" tabindex="-1"><span data-i18n="tabAdd"></span></button>
                <button type="button" class="bloom-tab" role="tab" id="bloomTab-server" data-tab="server" aria-controls="bloomPanel-server" aria-selected="false" tabindex="-1"><span data-i18n="thisServer"></span></button>
                <button type="button" class="bloom-tab" role="tab" id="bloomTab-libraries" data-tab="libraries" aria-controls="bloomPanel-libraries" aria-selected="false" tabindex="-1"><span data-i18n="tabLibraries"></span></button>
                <button type="button" class="bloom-tab" role="tab" id="bloomTab-arr" data-tab="arr" aria-controls="bloomPanel-arr" aria-selected="false" tabindex="-1"><span data-i18n="arrTitle"></span></button>
            </div>

            <!-- My friends -->
            <div class="bloom-panel" role="tabpanel" id="bloomPanel-friends" data-panel="friends" aria-labelledby="bloomTab-friends">
                <div class="bloom-card bloom-hidden" id="bloomSummary">
                    <h3 data-i18n="summaryTitle"></h3>
                    <div class="bloom-stats" id="bloomStats"></div>
                    <p class="bloom-muted" data-i18n="summaryHelp"></p>
                </div>
                <div class="bloom-card">
                    <div id="bloomPeers"><p class="bloom-muted" data-i18n="loading"></p></div>
                </div>
            </div>

            <!-- Add a friend: invite one, or join one -->
            <div class="bloom-panel bloom-hidden" role="tabpanel" id="bloomPanel-add" data-panel="add" aria-labelledby="bloomTab-add">
                <div class="bloom-card">
                    <h3 data-i18n="inviteTitle"></h3>
                    <p class="bloom-muted" data-i18n="inviteHelp"></p>
                    <div class="bloom-libs" id="bloomInviteLibs"></div>
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="bloomInviteLabel" data-i18n="inviteFor"></label>
                        <input id="bloomInviteLabel" type="text" is="emby-input" />
                    </div>
                    <button is="emby-button" type="button" id="bloomCreateInvite" class="raised emby-button"><span data-i18n="createInvite"></span></button>
                    <div class="bloom-msg" id="bloomInviteMsg"></div>
                    <div id="bloomInviteResult" class="bloom-hidden">
                        <p data-i18n="inviteCode"></p>
                        <textarea class="bloom-code" id="bloomInviteCode" readonly></textarea>
                        <div class="bloom-row" style="margin-top:.5em">
                            <button is="emby-button" type="button" id="bloomCopyInvite" class="raised emby-button bloom-small"><span data-i18n="copy"></span></button>
                            <span class="bloom-muted"><span data-i18n="theyWillSee"></span> <span class="bloom-fp" id="bloomInviteFp"></span></span>
                        </div>
                    </div>
                    <p class="bloom-muted" id="bloomPendingInvites"></p>
                </div>

                <div class="bloom-card">
                    <h3 data-i18n="joinTitle"></h3>
                    <p class="bloom-muted" data-i18n="joinHelp"></p>
                    <textarea class="bloom-code" id="bloomJoinCode" placeholder="bloom1:…"></textarea>
                    <div style="margin-top:.6em">
                        <button is="emby-button" type="button" id="bloomInspect" class="raised emby-button"><span data-i18n="inspect"></span></button>
                    </div>
                    <div class="bloom-msg" id="bloomJoinMsg"></div>
                    <div id="bloomJoinPreview" class="bloom-hidden">
                        <p><span data-i18n="inviteFrom"></span> <strong id="bloomJoinName"></strong> (<span id="bloomJoinUrl"></span>)</p>
                        <p><span data-i18n="announcedFingerprint"></span> <span class="bloom-fp" id="bloomJoinFp"></span></p>
                        <p class="bloom-muted" data-i18n="compareFingerprint"></p>
                        <p data-i18n="shareBack"></p>
                        <div class="bloom-libs" id="bloomJoinLibs"></div>
                        <button is="emby-button" type="button" id="bloomAccept" class="raised button-submit emby-button"><span data-i18n="becomeFriends"></span></button>
                    </div>
                </div>
            </div>

            <!-- One form for both tabs of settings: either Save button saves them all -->
            <form id="bloomSettingsForm">
                <!-- This server: what friends see of it -->
                <div class="bloom-panel bloom-hidden" role="tabpanel" id="bloomPanel-server" data-panel="server" aria-labelledby="bloomTab-server">
                    <div class="bloom-card">
                        <p><span data-i18n="yourFingerprint"></span> <span class="bloom-fp" id="bloomFingerprint">…</span></p>
                        <p class="bloom-muted" data-i18n="fingerprintHelp"></p>
                        <div class="inputContainer">
                            <label class="inputLabel inputLabelUnfocused" for="bloomPublicUrl" data-i18n="publicUrl"></label>
                            <input id="bloomPublicUrl" type="url" is="emby-input" data-i18n-placeholder="publicUrlExample" />
                            <div class="fieldDescription">
                                <span data-i18n="publicUrlHelp"></span>
                                <a href="#" id="bloomUseSuggested" class="bloom-hidden"><span data-i18n="use"></span> <span id="bloomSuggested"></span></a>
                            </div>
                        </div>
                        <div class="inputContainer">
                            <label class="inputLabel inputLabelUnfocused" for="bloomServerName" data-i18n="serverName"></label>
                            <input id="bloomServerName" type="text" is="emby-input" />
                            <div class="fieldDescription" data-i18n="serverNameHelp"></div>
                        </div>
                        <div class="checkboxContainer checkboxContainer-withDescription">
                            <label class="emby-checkbox-label">
                                <input id="bloomNotify" type="checkbox" is="emby-checkbox" />
                                <span data-i18n="notify"></span>
                            </label>
                            <div class="fieldDescription checkboxFieldDescription" data-i18n="notifyHelp"></div>
                        </div>
                        <div class="checkboxContainer checkboxContainer-withDescription">
                            <label class="emby-checkbox-label">
                                <input id="bloomSleeps" type="checkbox" is="emby-checkbox" />
                                <span data-i18n="sleeps"></span>
                            </label>
                            <div class="fieldDescription checkboxFieldDescription" data-i18n="sleepsHelp"></div>
                        </div>
                        <button is="emby-button" type="submit" class="raised button-submit emby-button"><span data-i18n="save"></span></button>
                        <div class="bloom-msg"></div>
                    </div>
                    <div class="bloom-card">
                        <h3 data-i18n="introVideoTitle"></h3>
                        <p class="fieldDescription" data-i18n="introVideoHelp"></p>
                        <p class="bloom-muted" id="bloomIntroState"></p>
                        <video id="bloomIntroPreview" class="bloom-hidden" controls playsinline preload="metadata" style="display:block;max-width:min(100%,560px);border-radius:8px;margin:.4em 0 .8em"></video>
                        <input type="file" id="bloomIntroFile" class="bloom-hidden" accept="video/mp4,video/quicktime,video/webm,video/x-matroska,.mp4,.m4v,.mov,.webm,.mkv" />
                        <div class="bloom-row">
                            <button is="emby-button" type="button" class="raised emby-button bloom-small" id="bloomIntroPick"><span id="bloomIntroPickLabel"></span></button>
                            <button is="emby-button" type="button" class="raised emby-button bloom-small bloom-hidden" id="bloomIntroRemove"><span data-i18n="introVideoRemove"></span></button>
                        </div>
                        <div class="bloom-msg" id="bloomIntroMsg"></div>
                    </div>
                </div>

                <!-- Libraries: how friends' items land in ours -->
                <div class="bloom-panel bloom-hidden" role="tabpanel" id="bloomPanel-libraries" data-panel="libraries" aria-labelledby="bloomTab-libraries">
                    <div class="bloom-card">
                        <p class="bloom-muted" data-i18n="librariesIntro"></p>
                        <div class="inputContainer">
                            <label class="inputLabel inputLabelUnfocused" for="bloomMediaRoot" data-i18n="mediaRoot"></label>
                            <input id="bloomMediaRoot" type="text" is="emby-input" />
                            <div class="fieldDescription"><span data-i18n="mediaRootHelp"></span> <span id="bloomDefaultRoot"></span></div>
                            <div class="fieldDescription" data-i18n="mediaRootMove"></div>
                        </div>
                        <div class="checkboxContainer checkboxContainer-withDescription">
                            <label class="emby-checkbox-label">
                                <input id="bloomSkipOwned" type="checkbox" is="emby-checkbox" />
                                <span data-i18n="skipOwned"></span>
                            </label>
                            <div class="fieldDescription checkboxFieldDescription" data-i18n="skipOwnedHelp"></div>
                        </div>
                        <div class="checkboxContainer checkboxContainer-withDescription">
                            <label class="emby-checkbox-label">
                                <input id="bloomVersions" type="checkbox" is="emby-checkbox" />
                                <span data-i18n="versions"></span>
                            </label>
                            <div class="fieldDescription checkboxFieldDescription" data-i18n="versionsHelp"></div>
                        </div>
                        <div class="selectContainer">
                            <label class="selectLabel" for="bloomBadgeStyle" data-i18n="badge"></label>
                            <select is="emby-select" id="bloomBadgeStyle" class="emby-select-withcolor emby-select"></select>
                            <div class="fieldDescription" data-i18n="badgeHelp"></div>
                        </div>
                        <div class="checkboxContainer checkboxContainer-withDescription">
                            <label class="emby-checkbox-label">
                                <input id="bloomFriendIntros" type="checkbox" is="emby-checkbox" />
                                <span data-i18n="friendIntros"></span>
                            </label>
                            <div class="fieldDescription checkboxFieldDescription" data-i18n="friendIntrosHelp"></div>
                        </div>
                        <button is="emby-button" type="submit" class="raised button-submit emby-button"><span data-i18n="save"></span></button>
                        <div class="bloom-msg"></div>
                    </div>
                </div>
            </form>

            <!-- Radarr and Sonarr -->
            <div class="bloom-panel bloom-hidden" role="tabpanel" id="bloomPanel-arr" data-panel="arr" aria-labelledby="bloomTab-arr">
                <div class="bloom-card">
                    <p class="bloom-muted" data-i18n="arrIntro"></p>
                    <form id="bloomArrForm" autocomplete="off">
                        <div class="bloom-cols">
                            <div>
                                <div class="inputContainer">
                                    <label class="inputLabel inputLabelUnfocused" for="bloomRadarrUrl" data-i18n="radarrUrl"></label>
                                    <input id="bloomRadarrUrl" type="url" is="emby-input" placeholder="http://radarr:7878" />
                                </div>
                                <div class="inputContainer">
                                    <label class="inputLabel inputLabelUnfocused" for="bloomRadarrKey" data-i18n="apiKey"></label>
                                    <input id="bloomRadarrKey" type="password" is="emby-input" autocomplete="new-password" />
                                    <div class="fieldDescription" data-i18n="apiKeyHelp"></div>
                                </div>
                                <p class="bloom-muted" id="bloomRadarrState"></p>
                            </div>
                            <div>
                                <div class="inputContainer">
                                    <label class="inputLabel inputLabelUnfocused" for="bloomSonarrUrl" data-i18n="sonarrUrl"></label>
                                    <input id="bloomSonarrUrl" type="url" is="emby-input" placeholder="http://sonarr:8989" />
                                </div>
                                <div class="inputContainer">
                                    <label class="inputLabel inputLabelUnfocused" for="bloomSonarrKey" data-i18n="apiKey"></label>
                                    <input id="bloomSonarrKey" type="password" is="emby-input" autocomplete="new-password" />
                                    <div class="fieldDescription" data-i18n="apiKeyHelp"></div>
                                </div>
                                <p class="bloom-muted" id="bloomSonarrState"></p>
                            </div>
                        </div>
                        <div class="selectContainer">
                            <label class="selectLabel" for="bloomArrAvoid" data-i18n="arrAvoid"></label>
                            <select is="emby-select" id="bloomArrAvoid" class="emby-select-withcolor emby-select">
                                <option value="GoodEnough" data-i18n="arrAvoidGoodEnough"></option>
                                <option value="Always" data-i18n="arrAvoidAlways"></option>
                                <option value="Off" data-i18n="arrAvoidOff"></option>
                            </select>
                            <div class="fieldDescription" data-i18n="arrAvoidHelp"></div>
                        </div>
                        <div class="checkboxContainer checkboxContainer-withDescription">
                            <label class="emby-checkbox-label">
                                <input id="bloomArrAdd" type="checkbox" is="emby-checkbox" />
                                <span data-i18n="arrAdd"></span>
                            </label>
                            <div class="fieldDescription checkboxFieldDescription" data-i18n="arrAddHelp"></div>
                        </div>
                        <button is="emby-button" type="submit" class="raised button-submit emby-button"><span data-i18n="save"></span></button>
                        <div class="bloom-msg" id="bloomArrMsg"></div>
                    </form>
                </div>
            </div>
        </div>
    </div>

            var lang = 'en';

            function pickLanguage() {
                var tag = (document.documentElement.getAttribute('lang') || navigator.language || 'en').toLowerCase();
                return tag.indexOf('fr') === 0 ? 'fr' : 'en';
            }

            // t('key', a, b) fills {0}, {1}…; tn('key', n, …) picks key_one or key_other for n.
            function t(key) {
                var text = STRINGS[lang][key] || STRINGS.en[key] || key;
                var args = arguments;
                return text.replace(/\{(\d+)\}/g, function (match, i) {
                    var value = args[Number(i) + 1];
                    return value === undefined ? match : String(value);
                });
            }

            function tn(key, n) {
                var one = lang === 'fr' ? n <= 1 : n === 1;
                var args = Array.prototype.slice.call(arguments, 1);
                return t.apply(null, [key + (one ? '_one' : '_other')].concat(args));
            }

            function translatePage() {
                lang = pickLanguage();
                Array.prototype.forEach.call(page.querySelectorAll('[data-i18n]'), function (el) {
                    el.textContent = t(el.getAttribute('data-i18n'));
                });
                Array.prototype.forEach.call(page.querySelectorAll('[data-i18n-placeholder]'), function (el) {
                    el.setAttribute('placeholder', t(el.getAttribute('data-i18n-placeholder')));
                });
            }

            function esc(value) {
                return String(value === null || value === undefined ? '' : value)
                    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
            }

            function fmtDate(value) {
                if (!value) return t('never');
                var d = new Date(value);
                return isNaN(d) ? '—' : d.toLocaleString(document.documentElement.getAttribute('lang') || undefined);
            }

            function fmtNumber(n) {
                return Number(n || 0).toLocaleString(document.documentElement.getAttribute('lang') || undefined);
            }

            // tn() with the number written the local way (1,182 / 1 182).
            function tnf(key, n) {
                var one = lang === 'fr' ? n <= 1 : n === 1;
                return t(key + (one ? '_one' : '_other'), fmtNumber(n));
            }

            // What is yours and what comes from friends: Jellyfin's dashboard only shows the sum.
            var summary = null;
            var wasBusy = false;

            async function loadSummary() {
                try {
                    summary = await call('GET', 'Library');
                } catch (e) {
                    summary = null;
                }
                renderSummary();
            }

            function renderSummary() {
                var card = $('#bloomSummary');
                var peers = (state && state.Peers) || [];
                if (!summary || !peers.length) {
                    card.classList.add('bloom-hidden');
                    return;
                }

                var names = {};
                peers.forEach(function (p) { names[p.Id] = p.ShownName; });
                function tile(kind, c) {
                    var friends = Object.keys(c.ByFriend || {}).map(function (id) {
                        return esc(names[id] || '?') + ' ' + esc(fmtNumber(c.ByFriend[id]));
                    }).join(' · ');
                    return '<div class="bloom-stat">' +
                        '<div class="bloom-stat-label">' + esc(t(kind)) + '</div>' +
                        '<div class="bloom-stat-total">' + esc(fmtNumber(c.Total)) + '</div>' +
                        '<div class="bloom-stat-line">' + esc(t('summaryOwn', fmtNumber(c.Own))) + '</div>' +
                        '<div class="bloom-stat-line">' + esc(t('summaryFriends', fmtNumber(c.Friends))) +
                            (c.Friends ? ' <span class="bloom-muted">' + esc(tnf('summaryNew', c.New)) + '</span>' : '') + '</div>' +
                        (friends ? '<div class="bloom-stat-friends">' + friends + '</div>' : '') +
                        '</div>';
                }

                $('#bloomStats').innerHTML = tile('movies', summary.Movies) + tile('shows', summary.Series) + tile('episodes', summary.Episodes);
                card.classList.remove('bloom-hidden');
            }

            function typeLabel(type) {
                return type === 'tvshows' ? t('shows') : (type === 'movies' ? t('movies') : (type || '?'));
            }

            function message(el, text, kind) {
                el.textContent = text || '';
                el.className = 'bloom-msg' + (kind ? ' ' + kind : '');
            }

            async function call(method, path, body) {
                var res = await fetch(ApiClient.getUrl('Bloom/Admin/' + path), {
                    method: method,
                    headers: {
                        'Authorization': 'MediaBrowser Token="' + ApiClient.accessToken() + '"',
                        'Content-Type': 'application/json',
                        'X-Bloom-Language': lang
                    },
                    body: body === undefined ? undefined : JSON.stringify(body)
                });
                var text = await res.text();
                var data = null;
                try { data = text ? JSON.parse(text) : null; } catch (e) { data = null; }
                if (!res.ok) {
                    throw new Error((data && (data.error || data.title)) || t('httpError', res.status));
                }
                return data;
            }

            function libCheckboxes(container, name, libs, selected) {
                if (!libs.length) {
                    container.innerHTML = '<span class="bloom-muted">' + esc(t('noMediaLibraries')) + '</span>';
                    return;
                }
                container.innerHTML = libs.map(function (lib) {
                    var checked = selected.indexOf(lib.Id) >= 0 ? ' checked' : '';
                    return '<div class="checkboxContainer"><label class="emby-checkbox-label">' +
                        '<input type="checkbox" is="emby-checkbox" data-lib="' + esc(lib.Id) + '" name="' + esc(name) + '"' + checked + ' />' +
                        '<span>' + esc(lib.Name) + ' <span class="bloom-muted">(' + esc(typeLabel(lib.CollectionType)) + ')</span></span></label></div>';
                }).join('');
            }

            function checkedLibs(container) {
                return Array.prototype.map.call(container.querySelectorAll('input[data-lib]:checked'), function (i) { return i.getAttribute('data-lib'); });
            }

            function normId(id) { return String(id || '').replace(/-/g, '').toLowerCase(); }

            var BADGE_STYLES = [
                ['styleGroupFriend', ['Glass', 'Frosted', 'Pill', 'ColorTab', 'Tab', 'Ribbon', 'RibbonGlass']],
                ['styleGroupFilm', ['PosterGlass', 'PosterLabel', 'PosterScrim', 'Cinema']],
                ['styleGroupPlain', ['NeutralGlass', 'Label', 'Corner', 'Scrim', 'Mark', 'Classic']]
            ];

            function renderBadgeStyles(current) {
                var html = BADGE_STYLES.map(function (group) {
                    return '<optgroup label="' + esc(t(group[0])) + '">' + group[1].map(function (style) {
                        return '<option value="' + style + '">' + esc(t('style_' + style)) + '</option>';
                    }).join('') + '</optgroup>';
                }).join('') + '<option value="none">' + esc(t('styleNone')) + '</option>';
                var select = $('#bloomBadgeStyle');
                select.innerHTML = html;
                select.value = current;
                if (!select.value) select.value = 'Glass';
            }

            var introPreviewTag = null;

            async function renderIntro(intro) {
                var preview = $('#bloomIntroPreview');
                $('#bloomIntroState').textContent = intro
                    ? t('introVideoSet', (intro.Size / 1048576).toLocaleString(lang, { maximumFractionDigits: 1 }))
                    : t('introVideoNone');
                $('#bloomIntroPickLabel').textContent = t(intro ? 'introVideoReplace' : 'introVideoPick');
                $('#bloomIntroRemove').classList.toggle('bloom-hidden', !intro);
                if (!intro) {
                    preview.classList.add('bloom-hidden');
                    preview.removeAttribute('src');
                    introPreviewTag = null;
                    return;
                }

                if (introPreviewTag === intro.IntroTag) return;
                introPreviewTag = intro.IntroTag;
                try {
                    // The video element cannot send the auth header: fetch it, then play it from memory.
                    var res = await fetch(ApiClient.getUrl('Bloom/Admin/Intro'), { headers: { 'Authorization': 'MediaBrowser Token="' + ApiClient.accessToken() + '"' } });
                    if (!res.ok) return;
                    if (preview.src) URL.revokeObjectURL(preview.src);
                    preview.src = URL.createObjectURL(await res.blob());
                    preview.classList.remove('bloom-hidden');
                } catch (e) {
                    preview.classList.add('bloom-hidden');
                }
            }

            function videoType(file) {
                if (file.type) return file.type;
                var ext = (file.name.split('.').pop() || '').toLowerCase();
                return { mp4: 'video/mp4', m4v: 'video/x-m4v', mov: 'video/quicktime', webm: 'video/webm', mkv: 'video/x-matroska' }[ext] || '';
            }

            // Tabs: the one shown last time, else "My friends" (or "Add a friend" while there is none yet).
            var currentTab = null;

            function showTab(name, focus) {
                if (!page.querySelector('.bloom-panel[data-panel="' + name + '"]')) name = 'friends';
                currentTab = name;
                Array.prototype.forEach.call(page.querySelectorAll('.bloom-tab'), function (tab) {
                    var on = tab.getAttribute('data-tab') === name;
                    tab.classList.toggle('bloom-tab-active', on);
                    tab.setAttribute('aria-selected', on ? 'true' : 'false');
                    tab.tabIndex = on ? 0 : -1;
                    if (on && focus) tab.focus();
                });
                Array.prototype.forEach.call(page.querySelectorAll('.bloom-panel'), function (panel) {
                    panel.classList.toggle('bloom-hidden', panel.getAttribute('data-panel') !== name);
                });
                try { localStorage.setItem('bloom-tab', name); } catch (e) { /* private mode: not remembered */ }
            }

            function firstTab() {
                var saved = null;
                try { saved = localStorage.getItem('bloom-tab'); } catch (e) { saved = null; }
                if (saved && page.querySelector('.bloom-panel[data-panel="' + saved + '"]')) return saved;
                return (state.Peers || []).length ? 'friends' : 'add';
            }

            Array.prototype.forEach.call(page.querySelectorAll('.bloom-tab'), function (tab) {
                tab.addEventListener('click', function () { showTab(tab.getAttribute('data-tab')); });
                tab.addEventListener('keydown', function (e) {
                    var tabs = Array.prototype.slice.call(page.querySelectorAll('.bloom-tab'));
                    var i = tabs.indexOf(tab);
                    var next = e.key === 'ArrowRight' ? i + 1 : e.key === 'ArrowLeft' ? i - 1 : e.key === 'Home' ? 0 : e.key === 'End' ? tabs.length - 1 : null;
                    if (next === null) return;
                    e.preventDefault();
                    showTab(tabs[(next + tabs.length) % tabs.length].getAttribute('data-tab'), true);
                });
            });

            function renderStatus() {
                var s = state;
                $('#bloomFingerprint').textContent = s.Identity.Fingerprint;
                $('#bloomInviteFp').textContent = s.Identity.Fingerprint;
                $('#bloomPublicUrl').value = s.Settings.PublicUrl || '';
                $('#bloomServerName').value = s.Settings.ServerName || '';
                $('#bloomServerName').setAttribute('placeholder', s.Identity.Name);
                $('#bloomMediaRoot').value = s.Settings.MediaRoot || '';
                $('#bloomDefaultRoot').textContent = s.MediaRoot;
                $('#bloomSkipOwned').checked = !!s.Settings.SkipOwnedItems;
                $('#bloomNotify').checked = !!s.Settings.NotifyPeersOnChange;
                renderBadgeStyles(s.Settings.BadgePosters ? (s.Settings.BadgeStyle || 'Glass') : 'none');
                $('#bloomFriendIntros').checked = s.Settings.PlayFriendIntros !== false;
                renderIntro(s.Intro);
                $('#bloomVersions').checked = !!s.Settings.GroupVersions;
                $('#bloomSleeps').checked = !!s.Settings.SleepsWhenIdle;
                renderArr();
                if (s.Identity.SuggestedUrl && !s.Settings.PublicUrl) {
                    $('#bloomSuggested').textContent = s.Identity.SuggestedUrl;
                    $('#bloomUseSuggested').classList.remove('bloom-hidden');
                } else {
                    $('#bloomUseSuggested').classList.add('bloom-hidden');
                }

                var allIds = s.ShareableLibraries.map(function (l) { return l.Id; });
                if (!$('#bloomInviteLibs').hasChildNodes()) libCheckboxes($('#bloomInviteLibs'), 'invite', s.ShareableLibraries, allIds);
                if (!$('#bloomJoinLibs').hasChildNodes()) libCheckboxes($('#bloomJoinLibs'), 'join', s.ShareableLibraries, allIds);

                var invites = s.Invites || [];
                $('#bloomPendingInvites').textContent = invites.length
                    ? tn('pendingInvites', invites.length, invites.map(function (i) { return t('pendingInvite', i.Label || t('unnamed'), fmtDate(i.ExpiresUtc)); }).join(', '))
                    : '';

                renderPeers();
                if (currentTab === null) showTab(firstTab());
            }

            // The state of Radarr or Sonarr under its fields: version and what Bloom did, or the error.
            function arrLine(el, app, info, running, avoidedKey, addedKey) {
                if (info.Releasing) {
                    el.textContent = info.Error || t('arrReleasing', app);
                    el.className = info.Error ? 'bloom-msg error' : 'bloom-muted';
                    return;
                }

                if (!info.Url) {
                    el.textContent = '';
                    el.className = 'bloom-muted';
                    return;
                }

                if (running) {
                    el.textContent = t('arrChecking');
                    el.className = 'bloom-muted';
                    return;
                }

                if (info.Error) {
                    el.textContent = info.Error;
                    el.className = 'bloom-msg error';
                    return;
                }

                if (!info.LastRun) {
                    el.textContent = '';
                    el.className = 'bloom-muted';
                    return;
                }

                var parts = [t('arrState', app, info.Version || '', fmtDate(info.LastRun)), tn(avoidedKey, info.NotDownloaded)];
                if (info.Added) parts.push(tn(addedKey, info.Added));
                el.textContent = parts.join(' · ');
                el.className = 'bloom-muted';
            }

            function renderArrState() {
                var arr = state.Arr;
                arrLine($('#bloomRadarrState'), 'Radarr', arr.Radarr, arr.Running, 'arrMoviesAvoided', 'arrMoviesAdded');
                arrLine($('#bloomSonarrState'), 'Sonarr', arr.Sonarr, arr.Running, 'arrEpisodesAvoided', 'arrSeriesAdded');
                clearTimeout(arrPollTimer);
                if (arr.Running) {
                    arrPollTimer = setTimeout(async function () {
                        try {
                            state = await call('GET', 'Status');
                            renderArrState();
                        } catch (e) {
                            // The next save or reload shows it.
                        }
                    }, 2000);
                }
            }

            function renderArr() {
                var arr = state.Arr;
                $('#bloomRadarrUrl').value = arr.Radarr.Url || '';
                $('#bloomSonarrUrl').value = arr.Sonarr.Url || '';
                $('#bloomRadarrKey').value = '';
                $('#bloomSonarrKey').value = '';
                $('#bloomRadarrKey').setAttribute('placeholder', arr.Radarr.HasApiKey ? t('apiKeySaved') : '');
                $('#bloomSonarrKey').setAttribute('placeholder', arr.Sonarr.HasApiKey ? t('apiKeySaved') : '');
                $('#bloomArrAvoid').value = arr.Avoid || 'GoodEnough';
                $('#bloomArrAdd').checked = !!arr.AddFriendsItems;
                renderArrState();
            }

            function peerStatus(peer) {
                function pill(kind, key) { return '<span class="bloom-pill ' + kind + '">' + esc(t(key)) + '</span>'; }
                if (peer.RevokedByPeer) return pill('bloom-err', 'statusRevoked');
                if (!peer.Enabled) return pill('bloom-off', 'statusPaused');
                if (peer.Busy) return pill('bloom-warn', 'statusSyncing');
                if (peer.LastError) return pill('bloom-err', 'statusError');
                if (peer.LastSync) return pill('bloom-ok', 'statusConnected');
                return pill('bloom-warn', 'statusWaiting');
            }

            function importSelect(peer, imp) {
                var targets = state.MergeTargets.filter(function (target) { return target.CollectionType === imp.CollectionType; });
                var current = imp.Mode === 'Merge' ? 'merge:' + (imp.TargetLibrary || '') : (imp.Mode === 'Separate' ? 'separate' : 'ignore');
                var options = targets.map(function (target) {
                    var v = 'merge:' + target.Name;
                    return '<option value="' + esc(v) + '"' + (v === current ? ' selected' : '') + '>' + esc(t('addTo', target.Name)) + '</option>';
                });
                options.push('<option value="separate"' + (current === 'separate' ? ' selected' : '') + '>' + esc(t('separateLibrary', imp.RemoteLibraryName + ' (' + peer.ShownName + ')')) + '</option>');
                options.push('<option value="ignore"' + (current === 'ignore' ? ' selected' : '') + '>' + esc(t('dontImport')) + '</option>');
                return '<select is="emby-select" class="emby-select-withcolor emby-select" data-import="' + esc(imp.RemoteLibraryId) + '">' + options.join('') + '</select>';
            }

            function renderPeers() {
                var container = $('#bloomPeers');
                var peers = state.Peers || [];
                var count = $('#bloomFriendsCount');
                count.textContent = peers.length ? String(peers.length) : '';
                count.classList.toggle('bloom-tab-alert', peers.some(function (p) { return p.LastError || p.RevokedByPeer; }));
                var editing = {};
                Array.prototype.forEach.call(container.querySelectorAll('[data-peer][data-editing]'), function (card) {
                    editing[card.getAttribute('data-peer')] = card;
                });
                if (!peers.length) {
                    container.innerHTML = '<p class="bloom-muted">' + esc(t('noFriends')) + '</p>';
                    return;
                }

                container.innerHTML = peers.map(function (peer) {
                    var shared = (peer.SharedLibraryIds || []).map(normId);
                    var shareBoxes = state.ShareableLibraries.map(function (lib) {
                        var checked = shared.indexOf(normId(lib.Id)) >= 0 ? ' checked' : '';
                        return '<div class="checkboxContainer"><label class="emby-checkbox-label">' +
                            '<input type="checkbox" is="emby-checkbox" data-lib="' + esc(lib.Id) + '"' + checked + ' />' +
                            '<span>' + esc(lib.Name) + '</span></label></div>';
                    }).join('') || '<span class="bloom-muted">' + esc(t('noLibraries')) + '</span>';

                    var imports = (peer.Imports || []).map(function (imp) {
                        var counts = imp.Mode === 'Ignore' ? '' : ' · ' + tn('titles', imp.ImportedCount)
                            + (imp.VersionCount ? ' ' + tn('otherVersions', imp.VersionCount) : '')
                            + (imp.SkippedCount ? ', ' + t('alreadyOwned', imp.SkippedCount) : '');
                        return '<div class="bloom-import"><div><strong>' + esc(imp.RemoteLibraryName) + '</strong> <span class="bloom-muted">' + esc(typeLabel(imp.CollectionType)) + esc(counts) + '</span></div>' + importSelect(peer, imp) + '</div>';
                    }).join('') || '<span class="bloom-muted">' + esc(t(peer.LastSync ? 'sharesNothing' : 'notSynced')) + '</span>';

                    return '<div class="bloom-peer" data-peer="' + esc(peer.Id) + '">' +
                        '<div class="bloom-row"><h4>' + esc(peer.ShownName) + '</h4>' + peerStatus(peer) + '</div>' +
                        '<div class="bloom-muted">' + esc(peer.Url) + ' · ' + esc(t('fingerprint')) + ' <span class="bloom-fp">' + esc(peer.Fingerprint) + '</span></div>' +
                        '<div class="bloom-muted">' + esc(t('friendsSince', fmtDate(peer.DateAdded), fmtDate(peer.LastSync))) + '</div>' +
                        (peer.Tag ? '<div class="bloom-muted">' + esc(t('tagHint', peer.Tag)) + '</div>' : '') +
                        (peer.Sleeps ? '<div class="bloom-muted">' + esc(t('peerSleeps')) + '</div>' : '') +
                        (peer.HasIntro ? '<div class="bloom-muted">' + esc(t('peerHasIntro')) + '</div>' : '') +
                        (peer.LastError ? '<div class="bloom-msg error">' + esc(peer.LastError) + '</div>' : '') +
                        '<div class="bloom-cols">' +
                            '<div><strong>' + esc(t('iShare', peer.ShownName)) + '</strong><div class="bloom-libs" data-role="shares">' + shareBoxes + '</div></div>' +
                            '<div><strong>' + esc(t('theyShare', peer.ShownName)) + '</strong><div data-role="imports">' + imports + '</div></div>' +
                        '</div>' +
                        '<div class="inputContainer" style="margin:1em 0 .4em">' +
                            '<input is="emby-input" type="text" data-role="alias" maxlength="40" label="' + esc(t('friendName')) + '" value="' + esc(peer.Alias || '') + '" placeholder="' + esc(peer.Name) + '" />' +
                            '<div class="fieldDescription">' + esc(t('friendNameHelp', peer.Name)) + '</div>' +
                        '</div>' +
                        '<div class="checkboxContainer" style="margin:.6em 0"><label class="emby-checkbox-label"><input type="checkbox" is="emby-checkbox" data-role="enabled"' + (peer.Enabled ? ' checked' : '') + ' /><span>' + esc(t('active')) + '</span></label></div>' +
                        '<div class="bloom-row">' +
                            '<button is="emby-button" type="button" class="raised button-submit emby-button bloom-small" data-action="save"><span>' + esc(t('save')) + '</span></button>' +
                            '<button is="emby-button" type="button" class="raised emby-button bloom-small" data-action="sync"' + (peer.Busy ? ' disabled' : '') + '><span>' + esc(t('syncNow')) + '</span></button>' +
                            '<button is="emby-button" type="button" class="raised emby-button bloom-small" data-action="remove"><span>' + esc(t('removeFriend')) + '</span></button>' +
                        '</div>' +
                        '<div class="bloom-msg" data-role="msg"></div>' +
                    '</div>';
                }).join('');

                // Cards the admin is editing are put back as they were (only their status is refreshed):
                // re-rendering them while a sync runs would throw away unsaved changes.
                Array.prototype.forEach.call(Object.keys(editing), function (id) {
                    var fresh = container.querySelector('[data-peer="' + id + '"]');
                    var old = editing[id];
                    if (!fresh) return;
                    old.querySelector('.bloom-pill').outerHTML = fresh.querySelector('.bloom-pill').outerHTML;
                    old.querySelector('[data-action="sync"]').disabled = fresh.querySelector('[data-action="sync"]').disabled;
                    fresh.replaceWith(old);
                });

                var busy = peers.some(function (p) { return p.Busy; });
                clearTimeout(pollTimer);
                if (busy) pollTimer = setTimeout(function () { load(true); }, 3000);

                // A sync just ended: the counts changed (Jellyfin scans right after, so ask again a bit later too).
                if (wasBusy && !busy) {
                    loadSummary();
                    setTimeout(loadSummary, 20000);
                }

                wasBusy = busy;
                renderSummary();
            }

            // poll: only refresh friends' status, leaving the forms (maybe being edited) alone.
            async function load(poll) {
                translatePage();
                try {
                    state = await call('GET', 'Status');
                    if (poll === true) {
                        renderPeers();
                    } else {
                        renderStatus();
                        loadSummary();
                    }
                } catch (e) {
                    $('#bloomPeers').innerHTML = '<p class="bloom-msg error">' + esc(e.message) + '</p>';
                }
            }

            $('#bloomIntroPick').addEventListener('click', function () {
                $('#bloomIntroFile').value = '';
                $('#bloomIntroFile').click();
            });

            $('#bloomIntroFile').addEventListener('change', async function () {
                var file = this.files && this.files[0];
                var msg = $('#bloomIntroMsg');
                if (!file) return;
                message(msg, t('introVideoSending'));
                try {
                    var res = await fetch(ApiClient.getUrl('Bloom/Admin/Intro'), {
                        method: 'POST',
                        headers: {
                            'Authorization': 'MediaBrowser Token="' + ApiClient.accessToken() + '"',
                            'Content-Type': videoType(file) || 'application/octet-stream',
                            'X-Bloom-Language': lang
                        },
                        body: file
                    });
                    var data = null;
                    try { data = await res.json(); } catch (e) { data = null; }
                    if (!res.ok) throw new Error((data && (data.error || data.title)) || t('httpError', res.status));
                    message(msg, t('introVideoSaved'), 'success');
                    await load();
                } catch (err) {
                    message(msg, err.message, 'error');
                }
            });

            $('#bloomIntroRemove').addEventListener('click', async function () {
                var msg = $('#bloomIntroMsg');
                try {
                    await call('DELETE', 'Intro');
                    message(msg, '');
                    await load();
                } catch (err) {
                    message(msg, err.message, 'error');
                }
            });

            $('#bloomUseSuggested').addEventListener('click', function (e) {
                e.preventDefault();
                $('#bloomPublicUrl').value = $('#bloomSuggested').textContent;
            });

            $('#bloomSettingsForm').addEventListener('submit', async function (e) {
                e.preventDefault();
                var msg = page.querySelector('#bloomSettingsForm .bloom-panel:not(.bloom-hidden) .bloom-msg');
                try {
                    await call('POST', 'Settings', {
                        PublicUrl: $('#bloomPublicUrl').value.trim() || null,
                        ServerName: $('#bloomServerName').value.trim() || null,
                        MediaRoot: $('#bloomMediaRoot').value.trim() || null,
                        SkipOwnedItems: $('#bloomSkipOwned').checked,
                        NotifyPeersOnChange: $('#bloomNotify').checked,
                        BadgePosters: $('#bloomBadgeStyle').value !== 'none',
                        BadgeStyle: $('#bloomBadgeStyle').value === 'none' ? (state.Settings.BadgeStyle || 'Glass') : $('#bloomBadgeStyle').value,
                        PlayFriendIntros: $('#bloomFriendIntros').checked,
                        GroupVersions: $('#bloomVersions').checked,
                        SleepsWhenIdle: $('#bloomSleeps').checked
                    });
                    message(msg, t('saved'), 'success');
                    await load();
                } catch (err) {
                    message(msg, err.message, 'error');
                }
                return false;
            });

            $('#bloomArrForm').addEventListener('submit', async function (e) {
                e.preventDefault();
                var msg = $('#bloomArrMsg');
                try {
                    await call('POST', 'Arr', {
                        RadarrUrl: $('#bloomRadarrUrl').value.trim() || null,
                        RadarrApiKey: $('#bloomRadarrKey').value.trim() || null,
                        SonarrUrl: $('#bloomSonarrUrl').value.trim() || null,
                        SonarrApiKey: $('#bloomSonarrKey').value.trim() || null,
                        Avoid: $('#bloomArrAvoid').value,
                        AddFriendsItems: $('#bloomArrAdd').checked
                    });
                    var connected = $('#bloomRadarrUrl').value.trim() || $('#bloomSonarrUrl').value.trim();
                    message(msg, connected ? t('arrSavedChecking') : t('saved'), 'success');
                    state = await call('GET', 'Status');
                    renderArr();
                } catch (err) {
                    message(msg, err.message, 'error');
                }
                return false;
            });

            $('#bloomCreateInvite').addEventListener('click', async function () {
                var msg = $('#bloomInviteMsg');
                message(msg, '');
                try {
                    var res = await call('POST', 'Invites', { SharedLibraryIds: checkedLibs($('#bloomInviteLibs')), Label: $('#bloomInviteLabel').value.trim() || null });
                    $('#bloomInviteCode').value = res.Code;
                    $('#bloomInviteResult').classList.remove('bloom-hidden');
                    message(msg, t('inviteCreated', fmtDate(res.ExpiresUtc)), 'success');
                    await load();
                } catch (err) {
                    message(msg, err.message, 'error');
                }
            });

            $('#bloomCopyInvite').addEventListener('click', function () {
                var area = $('#bloomInviteCode');
                area.select();
                var done = function () { message($('#bloomInviteMsg'), t('codeCopied'), 'success'); };
                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(area.value).then(done, function () { document.execCommand('copy'); done(); });
                } else {
                    document.execCommand('copy');
                    done();
                }
            });

            $('#bloomInspect').addEventListener('click', async function () {
                var msg = $('#bloomJoinMsg');
                message(msg, '');
                $('#bloomJoinPreview').classList.add('bloom-hidden');
                try {
                    var info = await call('POST', 'Invites/Inspect', { Code: $('#bloomJoinCode').value.trim() });
                    if (info.IsSelf) throw new Error(t('ownInvite'));
                    if (info.AlreadyFriend) throw new Error(t('alreadyFriend', info.Name));
                    $('#bloomJoinName').textContent = info.Name;
                    $('#bloomJoinUrl').textContent = info.Url;
                    $('#bloomJoinFp').textContent = info.Fingerprint;
                    $('#bloomJoinPreview').classList.remove('bloom-hidden');
                } catch (err) {
                    message(msg, err.message, 'error');
                }
            });

            $('#bloomAccept').addEventListener('click', async function () {
                var msg = $('#bloomJoinMsg');
                var button = this;
                button.disabled = true;
                message(msg, t('exchangingKeys'));
                try {
                    var res = await call('POST', 'Invites/Accept', { Code: $('#bloomJoinCode').value.trim(), SharedLibraryIds: checkedLibs($('#bloomJoinLibs')) });
                    message(msg, t('nowFriends', res.Name), 'success');
                    $('#bloomJoinCode').value = '';
                    $('#bloomJoinPreview').classList.add('bloom-hidden');
                    await load();
                    showTab('friends');
                } catch (err) {
                    message(msg, err.message, 'error');
                } finally {
                    button.disabled = false;
                }
            });

            $('#bloomPeers').addEventListener('change', function (e) {
                var card = e.target.closest('[data-peer]');
                if (card) card.setAttribute('data-editing', '1');
            });

            $('#bloomPeers').addEventListener('click', async function (e) {
                var button = e.target.closest('button[data-action]');
                if (!button) return;
                var card = button.closest('[data-peer]');
                var peerId = card.getAttribute('data-peer');
                var peer = state.Peers.filter(function (p) { return p.Id === peerId; })[0];
                var msg = card.querySelector('[data-role="msg"]');
                var action = button.getAttribute('data-action');
                try {
                    if (action === 'save') {
                        var imports = Array.prototype.map.call(card.querySelectorAll('select[data-import]'), function (sel) {
                            var v = sel.value;
                            return v.indexOf('merge:') === 0
                                ? { RemoteLibraryId: sel.getAttribute('data-import'), Mode: 'Merge', TargetLibrary: v.substring(6) }
                                : { RemoteLibraryId: sel.getAttribute('data-import'), Mode: v === 'separate' ? 'Separate' : 'Ignore' };
                        });
                        await call('POST', 'Peers/' + encodeURIComponent(peerId), {
                            Enabled: card.querySelector('[data-role="enabled"]').checked,
                            Alias: card.querySelector('[data-role="alias"]').value.trim(),
                            SharedLibraryIds: checkedLibs(card.querySelector('[data-role="shares"]')),
                            Imports: imports
                        });
                        message(msg, t('savedUpdating'), 'success');
                        card.removeAttribute('data-editing');
                        setTimeout(load, 1500);
                    } else if (action === 'sync') {
                        button.disabled = true;
                        message(msg, t('statusSyncing'));
                        await call('POST', 'Peers/' + encodeURIComponent(peerId) + '/Sync');
                        await load();
                    } else if (action === 'remove') {
                        if (!window.confirm(t('confirmRemove', peer.ShownName))) return;
                        await call('DELETE', 'Peers/' + encodeURIComponent(peerId));
                        await load();
                    }
                } catch (err) {
                    message(msg, err.message, 'error');
                    button.disabled = false;
                }
            });

            page.addEventListener('pageshow', load);
            page.addEventListener('viewshow', load);
            if (window.ApiClient) load();
        })();
    </script>
</div>
</body>
</html>
